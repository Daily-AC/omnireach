# Source Registry — single source of truth for available sources.
# Schema:
#   id: string                         (matches AdapterBase.name)
#   tier: ready | one_step | heavy | booster | wip
#                                      (visualized in `omnireach sources`)
#   adapter: python.dotted.path        (importable AdapterBase subclass)
#   description: human label (zh)
#   query_hints: [str]                 (router weights these queries toward this source)
#   default_in_auto: bool              (included in auto fanout when ready)
#   deps:
#     auto: [{kind: pipx|npm|pip, name: str}]
#     manual: [{step: str, verify: str}]

- id: hackernews
  tier: ready
  adapter: omnireach.adapters.hackernews.HackerNewsAdapter
  description: HackerNews 全文搜索
  query_hints: [hn, hackernews, "show hn"]
  default_in_auto: true
  trust: 0.85
  timeout_seconds: 10
  deps: { auto: [], manual: [] }

- id: youtube
  tier: ready
  adapter: omnireach.adapters.youtube.YouTubeAdapter
  description: YouTube 视频搜索 + 字幕提取
  query_hints: [youtube, "video", "视频", "教程"]
  default_in_auto: true
  trust: 0.60
  timeout_seconds: 20
  deps: { auto: [], manual: [] }

- id: github
  tier: ready
  adapter: omnireach.adapters.github.GitHubAdapter
  description: GitHub 仓库/Issue/Discussion 搜索
  query_hints: [github, repo, issue, "源码"]
  default_in_auto: true
  trust: 0.90
  timeout_seconds: 15
  deps: { auto: [], manual: [] }

- id: rss
  tier: ready
  adapter: omnireach.adapters.rss.RssAdapter
  description: RSS / Atom 源阅读
  query_hints: [rss, atom, feed, "订阅"]
  default_in_auto: false
  trust: 0.75
  timeout_seconds: 15
  deps: { auto: [], manual: [] }

- id: wechat
  tier: ready
  adapter: omnireach.adapters.wechat.WeChatAdapter
  description: 微信公众号 (Sogou 免费搜索, EXA_API_KEY 可选启用语义增强)
  query_hints: [微信, 公众号, wechat]
  # default_in_auto: false because Sogou search adds ~3s latency to every
  # auto fanout. Users discover via query hint or explicit --on wechat.
  default_in_auto: false
  trust: 0.55
  timeout_seconds: 20
  enhanced_with: EXA_API_KEY
  deps: { auto: [], manual: [] }

- id: bilibili
  tier: ready
  adapter: omnireach.adapters.bilibili.BilibiliAdapter
  description: B站视频/笔记 (B站官方 search API, EXA_API_KEY 可选启用语义增强)
  query_hints: [b站, bilibili, 哔哩哔哩]
  default_in_auto: false
  trust: 0.55
  timeout_seconds: 15
  enhanced_with: EXA_API_KEY
  deps: { auto: [], manual: [] }

- id: google
  tier: heavy
  adapter: omnireach.adapters.google.GoogleAdapter
  description: Google 网页搜索 (OpenCLI 后台临时 tab)
  query_hints: [google, "谷歌", "网页搜索"]
  default_in_auto: false
  trust: 0.85
  timeout_seconds: 15
  deps:
    auto:
      - { kind: npm, name: "github:Daily-AC/OpenCLI" }
    manual:
      - { step: "在 Chrome Web Store 安装 OpenCLI 扩展: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk", verify: "opencli doctor" }

- id: reddit
  tier: heavy
  adapter: omnireach.adapters.reddit.RedditAdapter
  description: Reddit 帖子搜索 (OpenCLI 后台临时 tab；Chrome 登录态可选)
  query_hints: [reddit, "r/", subreddit]
  # Browser-backed sources stay opt-in so auto fanout never opens Chrome tabs.
  default_in_auto: false
  trust: 0.70
  timeout_seconds: 20
  deps:
    auto:
      - { kind: npm, name: "github:Daily-AC/OpenCLI" }
    manual:
      - { step: "在 Chrome Web Store 安装 OpenCLI 扩展: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk (装完后启用 chrome://extensions 里的开发者模式)", verify: "opencli doctor" }
      - { step: "可选：在 Chrome 中登录 reddit.com，以继承账号可见内容和偏好" }

- id: twitter
  tier: heavy
  adapter: omnireach.adapters.twitter.TwitterAdapter
  description: Twitter / X 搜索 (登录态 Chrome, OpenCLI 后台临时 tab)
  query_hints: [twitter, "x.com", "推特"]
  default_in_auto: false
  trust: 0.60
  timeout_seconds: 30
  deps:
    auto:
      - { kind: npm, name: "github:Daily-AC/OpenCLI" }
    manual:
      - { step: "在 Chrome Web Store 安装 OpenCLI 扩展: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk (装完后启用 chrome://extensions 里的开发者模式)", verify: "opencli doctor" }
      - { step: "在 Chrome 中登录 Twitter / X 账号 (打开 twitter.com 完成登录)", verify: "opencli twitter state" }

- id: xiaohongshu
  tier: heavy
  adapter: omnireach.adapters.xiaohongshu.XiaohongshuAdapter
  description: 小红书 搜索 + 笔记内容 (登录态 Chrome, OpenCLI 后台临时 tab)
  query_hints: ["小红书", xiaohongshu, "种草", "笔记"]
  default_in_auto: false
  trust: 0.50
  timeout_seconds: 30
  deps:
    auto:
      - { kind: npm, name: "github:Daily-AC/OpenCLI" }
    manual:
      - { step: "在 Chrome Web Store 安装 OpenCLI 扩展: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk", verify: "opencli doctor" }
      - { step: "在 Chrome 中登录 小红书 账号 (打开 xiaohongshu.com 完成登录)", verify: "opencli xiaohongshu state" }

- id: tiktok
  tier: heavy
  adapter: omnireach.adapters.tiktok.TikTokAdapter
  description: TikTok 视频搜索 (国际版, 登录态 Chrome, OpenCLI 后台临时 tab)
  query_hints: [tiktok, "海外短视频"]
  default_in_auto: false
  trust: 0.55
  timeout_seconds: 30
  deps:
    auto:
      - { kind: npm, name: "github:Daily-AC/OpenCLI" }
    manual:
      - { step: "在 Chrome Web Store 安装 OpenCLI 扩展: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk", verify: "opencli doctor" }
      - { step: "在 Chrome 中登录 TikTok 账号 (打开 tiktok.com 完成登录)", verify: "opencli tiktok explore --limit 1 --format json" }

- id: douyin
  tier: heavy
  adapter: omnireach.adapters.douyin.DouyinAdapter
  description: 抖音 视频搜索 (登录态 Chrome, OpenCLI 后台临时 tab)
  query_hints: ["抖音", douyin]
  default_in_auto: false
  trust: 0.55
  timeout_seconds: 30
  deps:
    auto:
      - { kind: npm, name: "github:Daily-AC/OpenCLI" }
    manual:
      - { step: "在 Chrome Web Store 安装 OpenCLI 扩展: https://chromewebstore.google.com/detail/opencli/ildkmabpimmkaediidaifkhjpohdnifk", verify: "opencli doctor" }
      - { step: "在 Chrome 中登录抖音账号 (打开 www.douyin.com 扫码登录)", verify: "opencli douyin search 测试 --limit 1 --format json" }

- id: tavily
  tier: booster
  adapter: omnireach.adapters.tavily.TavilyAdapter
  description: Tavily Search API (付费, web 类增强)
  query_hints: []
  # Configured boosters are appended by the service layer.
  default_in_auto: false
  trust: 0.85
  timeout_seconds: 10
  deps:
    auto: []
    manual:
      - step: "去 https://tavily.com 注册并复制 API Key"
        verify: "echo $TAVILY_API_KEY 非空"

- id: brave
  tier: booster
  adapter: omnireach.adapters.brave.BraveAdapter
  description: Brave Search API (付费, 隐私友好 web 搜索)
  query_hints: []
  default_in_auto: false
  trust: 0.80
  timeout_seconds: 10
  deps:
    auto: []
    manual:
      - step: "去 https://brave.com/search/api 注册并复制 Key"
        verify: "echo $BRAVE_API_KEY 非空"

- id: perplexity
  tier: booster
  adapter: omnireach.adapters.perplexity.PerplexityAdapter
  description: Perplexity Sonar (付费, AI 检索摘要)
  query_hints: []
  default_in_auto: false
  trust: 0.90
  timeout_seconds: 30
  deps:
    auto: []
    manual:
      - step: "去 https://perplexity.ai/settings/api 注册并复制 Key"
        verify: "echo $PERPLEXITY_API_KEY 非空"

- id: exa
  tier: booster
  adapter: omnireach.adapters.exa.ExaAdapter
  description: Exa Search API (付费, web search)
  query_hints: []
  default_in_auto: false
  trust: 0.85
  timeout_seconds: 15
  deps:
    auto: []
    manual:
      - step: "去 https://exa.ai 注册并复制 API Key"
        verify: "echo $EXA_API_KEY 非空"
