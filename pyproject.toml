[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnireach"
version = "0.11.0-alpha"
description = "Give your agent the senses of a logged-in human across the whole internet — search & read 15+ platforms (Twitter/Reddit/小红书/微信/抖音/B站/TikTok/YouTube/HN/GitHub/RSS) incl. login-walled verticals no web search reaches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daily-AC", email = "zoned-group@alum.calarts.edu" }]
keywords = ["claude", "search", "agent", "skill", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "rich>=13.7",
  "feedparser>=6.0,<7.0",
  "lxml>=6.1.1",
  "cssselect>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "pexpect>=4.9",
]

[project.scripts]
omnireach = "omnireach.cli:_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["omnireach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = []
