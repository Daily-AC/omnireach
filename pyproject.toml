[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnireach"
version = "0.17.0-alpha"
description = "Search, read, and parse media across the login-walled Chinese internet for AI agents — one CLI and stable JSON contracts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daily-AC", email = "zoned-group@alum.calarts.edu" }]
keywords = ["claude", "search", "agent", "skill", "cli", "wechat", "xiaohongshu", "douyin", "bilibili"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "rich>=13.7",
  "feedparser>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "pexpect>=4.9",
]

[project.scripts]
omnireach = "omnireach.cli:_entrypoint"

[project.urls]
Homepage = "https://github.com/Daily-AC/omnireach"
Repository = "https://github.com/Daily-AC/omnireach"
Issues = "https://github.com/Daily-AC/omnireach/issues"
Changelog = "https://github.com/Daily-AC/omnireach/releases"

[tool.hatch.build.targets.wheel]
packages = ["omnireach"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "skills/", ".claude-plugin/", ".github/", ".impeccable/", "tests/", "install.sh", "scripts/", "CLAUDE.md", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = []
