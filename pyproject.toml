[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnireach"
version = "0.6.3-alpha"
description = "全网通搜索: web + 多平台 (Twitter / Reddit / YouTube / B站 / 小红书 / HN / GitHub) — 一个 CLI + Skill 解决中转站 Agent 用不了 WebSearch 的问题"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daily-AC", email = "zoned-group@alum.calarts.edu" }]
keywords = ["claude", "search", "agent", "skill", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "rich>=13.7",
  "feedparser>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "pexpect>=4.9",
]

[project.scripts]
omnireach = "omnireach.cli:_entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["omnireach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
